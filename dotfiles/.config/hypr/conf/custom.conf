# Add your additional Hyprland configurations here
# 
# This is an additional key binding 
# bind = $mainMod CTRL, up, workspace, empty
# 
# Example for xwayland
# xwayland {
#   force_zero_scaling = true
# }

# QT
env = QT_QPA_PLATFORMTHEME,qt6ct
#env = QT_QPA_PLATFORMTHEME,qt5ct
#env = QT_QPA_PLATFORMTHEME,wayland

# SDL version
env = SDL_VIDEODRIVER,wayland
# env = SDL_VIDEODRIVER,x11

# Speicherort für Screenshots
env = XDG_SCREENSHOTS_DIR,$HOME/Bilder/screenshots

env = _JAVA_AWT_WM_NONREPARENTING,1

# Set the cursor size for xcursor
env = XCURSOR_SIZE,32

# Freigabe für Gufw/Opensnitch Firewall GUI
#exec-once = xhost +si:localuser:root

# Jetbrains IDE Fix for rendering
exec-once = wmname LG3D

# No Hardware Cursor
# cursor {
#     no_hardware_cursors = false
# }

# Start NetworkManager applet
#exec-once = ~/.config/ml4w/scripts/nm-applet.sh

# Start my apps
exec-once = ~/.config/ml4w/scripts/guido-autostart.sh

# Update hyprland plugins if needed
exec-once = ~/.config/ml4w/scripts/gdg-update-hyprland-plugins.sh

# Hyprland Plugins laden
exec = hyprpm reload -n


debug {
    disable_logs = false
    disable_time = false
}

misc {
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

input {
    kb_layout = de
    kb_variant = nodeadkeys
    kb_model = pc105
    kb_options = shift:breaks_caps
    numlock_by_default = true
    follow_mouse = 1
    mouse_refocus = false

    touchpad {
        # for desktop
        # natural_scroll = false

        # for laptop
        natural_scroll = true
        middle_button_emulation = false
        clickfinger_behavior = true
        disable_while_typing = true
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

plugin {
    split-monitor-workspaces {
        count = 10
        keep_focused = 0
        enable_notifications = 0
    }

    hyprbars {
        # example config
        bar_height = 30
        bar_text_size = 12

        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        #hyprbars-button = rgb(ff4040), 20, 󰖭, hyprctl dispatch killactive
        #hyprbars-button = rgb(eeee11), 20, , hyprctl dispatch fullscreen 1
    }

    #overview {
    #    panelHeight = 155
    #    centerAligned = false
    #    showNewWorkspace = false
    #}
}

# Unset previous rules
windowrulev2 = unset,class:(com.ml4w.sidebar)
windowrulev2 = unset,class:(io.missioncenter.MissionCenter)
windowrulev2 = unset,class:(dotfiles-floating)
windowrulev2 = unset,class:(ml4w.dotfiles.floating)
windowrulev2 = unset,title:(ChatGPT.*)
windowrulev2 = unset,title:(.*chat.openai.com.*)
windowrulev2 = unset,title:(nwg-displays)

# nwg-look
windowrulev2 = float,class:(nwg-displays)
windowrulev2 = size 90% 80%,class:(nwg-displays)
windowrulev2 = center,class:(nwg-displays)
windowrulev2 = pin,class:(nwg-displays)


# ML4W Sidebar floating
windowrulev2 = float, class:(com.ml4w.sidebar)
windowrulev2 = pin, class:(com.ml4w.sidebar)
windowrulev2 = size 400 726,class:(com.ml4w.sidebar)
windowrulev2 = move 100%-w-16 90,class:(com.ml4w.sidebar)

# System Mission Center
windowrulev2 = float,class:(io.missioncenter.MissionCenter)
windowrulev2 = pin,class:(io.missioncenter.MissionCenter)
windowrulev2 = center,class:(io.missioncenter.MissionCenter)
windowrulev2 = size 90% 80%,class:(io.missioncenter.MissionCenter)

# General floating
windowrulev2 = float,class:(dotfiles-floating)
windowrulev2 = pin,class:(dotfiles-floating)
windowrulev2 = center,class:(dotfiles-floating)
windowrulev2 = size 90% 80%,class:(dotfiles-floating)

# Floating for Ghostty
windowrulev2 = float,class:(ml4w.dotfiles.floating)
windowrulev2 = size 90% 80%,class:(ml4w.dotfiles.floating)
windowrulev2 = center,class:(ml4w.dotfiles.floating)
windowrulev2 = pin, class:(ml4w.dotfiles.floating)

# Gnome Feh/Loupe
windowrulev2 = float,class:(feh)
windowrulev2 = size 90% 80%,class:(feh)
windowrulev2 = float,class:(org.gnome.Loupe)
windowrulev2 = size 90% 80%,class:(org.gnome.Loupe)
